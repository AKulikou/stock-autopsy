name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to a new release on its own
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      # config.py fails fast without a key; the tests replace Claude with a fake
      # client, so this placeholder never reaches the API.
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
